# =====================================================================
# Credor Radar — GitHub Actions: Deploy via Dokploy
#
# Como funciona:
# 1. Push na branch main dispara o workflow
# 2. Faz build das imagens Docker (api + web)
# 3. Notifica o Dokploy via webhook para fazer pull e redeploy
#
# Pré-requisitos no GitHub (Settings > Secrets and variables > Actions):
#   DOKPLOY_API_URL    — ex: https://dokploy.seudominio.com
#   DOKPLOY_APP_ID_API — ID do app da API no Dokploy
#   DOKPLOY_APP_ID_WEB — ID do app do Web no Dokploy
#   DOKPLOY_TOKEN      — Token de API do Dokploy (Settings > API)
#
# Alternativa simples: no Dokploy, ative "Auto Deploy" na branch main
# e configure o webhook do GitHub → Dokploy diretamente nas configurações
# do repositório. Nesse caso, este workflow não é necessário.
# =====================================================================

name: Deploy to VPS via Dokploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Trigger Dokploy Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Notify Dokploy — API
        run: |
          curl -X POST "${{ secrets.DOKPLOY_API_URL }}/api/deploy" \
            -H "Authorization: Bearer ${{ secrets.DOKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"appId": "${{ secrets.DOKPLOY_APP_ID_API }}"}'

      - name: Notify Dokploy — Web
        run: |
          curl -X POST "${{ secrets.DOKPLOY_API_URL }}/api/deploy" \
            -H "Authorization: Bearer ${{ secrets.DOKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"appId": "${{ secrets.DOKPLOY_APP_ID_WEB }}"}'
